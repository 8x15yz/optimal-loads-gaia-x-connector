<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLUEMAP · Management Console</title>
<style>
:root{font-family:Inter,'Noto Sans KR',system-ui,sans-serif;color:#23354a;background:#f3f6fa;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #cbd5e1;border-radius:7px;padding:9px 13px;background:white;color:#23354a}button:hover{background:#edf4ff}button.primary{background:#175cd3;color:white;border-color:#175cd3}button.danger{color:#b42318}button:disabled{opacity:.5;cursor:wait}input,select{padding:10px;border:1px solid #cbd5e1;border-radius:7px;background:white;max-width:100%}label{display:block;margin:12px 0 6px}aside{width:236px;background:#112539;color:#d3dfed;position:fixed;inset:0 auto 0 0;padding:30px 20px}aside h2{color:white;font-size:20px;letter-spacing:2px;margin:0}aside small{color:#8cabc8;display:block;margin:8px 0 38px}nav button{display:block;text-align:left;width:100%;border:0;background:transparent;color:#c7d4e5;margin:8px 0;padding:12px}nav button.active{background:#234666;color:white}aside footer{position:absolute;bottom:25px;font-size:12px;color:#a9bfd3}main{margin-left:236px;padding:32px 40px;max-width:1600px}header{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:26px}h1{font-size:26px;letter-spacing:-.6px;margin:8px 0}h2{font-size:18px;margin:0 0 14px}h3{font-size:15px;margin:0 0 10px}p{line-height:1.65}small,.muted{color:#64748b}.eyebrow{font-size:12px;color:#175cd3;font-weight:700;letter-spacing:1.5px}.card{background:white;border:1px solid #dee5ed;border-radius:12px;padding:22px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.grid .card{margin:0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.badge{display:inline-block;padding:4px 9px;border-radius:20px;font-size:12px;background:#eef2f6;color:#526579}.pass{background:#e3f6ed;color:#087443}.fail{background:#fff0ed;color:#b42318}.unknown,.warning{background:#fff6db;color:#986600}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;border-bottom:1px solid #e9eef4;padding:11px 8px;vertical-align:top}th{color:#64748b;font-weight:500}td:last-child{line-height:1.55}summary{cursor:pointer;padding:13px 0}.scroll{overflow:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f7fa;padding:16px;border-radius:8px;font-size:12px;max-height:400px;overflow:auto}code{overflow-wrap:anywhere}#notice{position:sticky;top:12px;z-index:5;border-radius:8px;padding:12px 16px;background:#e6efff;display:none;white-space:pre-wrap}#notice.error{background:#fff0ed;color:#b42318}.auth{max-width:460px;margin:7vh auto}.auth input{width:100%}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.steps span{padding:9px 14px;background:#e8eef7;border-radius:6px}.empty{padding:24px;color:#64748b;text-align:center}.scope{background:#fff7dc;border:1px solid #ebd99a;padding:14px;border-radius:8px;margin-bottom:20px}.key{width:100%;font-family:monospace;font-size:12px}.footnote{font-size:12px;color:#64748b;margin-top:28px}@media(max-width:850px){aside{position:static;width:auto;padding:20px}aside small{margin:6px 0 12px}aside footer{display:none}nav{display:flex;flex-wrap:wrap}nav button{width:auto}main{margin:0;padding:20px}.grid{grid-template-columns:1fr}header{align-items:flex-start}.scroll{max-width:100%}}
</style></head><body>
<aside><h2>BLUEMAP</h2><small>GAIA-X · DEMO PORTAL</small><nav id="nav"></nav><footer>Non-production PoC<br>VC 기반 접근 제어 실험</footer></aside>
<main><header><div><div class="eyebrow">CREDENTIAL & DATA ACCESS</div><h1 id="title">Management Console</h1><div class="muted">자격증명 등록부터 데이터 연결까지</div></div><div id="userbar" class="row"></div></header><div id="notice" role="status" aria-live="polite"></div><div id="scope"></div><div id="content"></div><p class="footnote">PoC 데모 · 검증 통과는 공식 Gaia-X 인증이나 업로더의 회사 대표 권한을 의미하지 않습니다.</p></main>
<script>
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token=sessionStorage.getItem('portal-account-token')||'', state=null,tab='overview',target='',logOffset=0,logFilter='',allLogs=false;
const labels={overview:'연결 현황',credentials:'VC 관리',services:'서비스 · 데이터 연결',logs:'활동 및 검증 로그',admin:'Admin Console'};
const statusNames={pass:'통과',fail:'실패',unknown:'확인 불가',warning:'주의',not_applicable:'해당 없음',skipped:'미실행'};
const dt=v=>v?new Date(typeof v==='number'?v*1000:v).toLocaleString('ko-KR'):'—';
const badge=(s,t)=>`<span class="badge ${esc(s)}">${esc(t||statusNames[s]||s)}</span>`;
const btn=(label,action,id='',cls='')=>`<button class="${cls}" data-action="${action}" data-id="${esc(id)}">${label}</button>`;
function notice(msg,error=false){$('notice').textContent=msg;$('notice').className=error?'error':'';$('notice').style.display='block'}
async function api(path,body,method){const opts={method:method||(body?'POST':'GET'),headers:{Authorization:'Bearer '+token}};if(body instanceof FormData)opts.body=body;else if(body){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(body)}const r=await fetch(path,opts);const text=await r.text();let data;try{data=JSON.parse(text)}catch{data={detail:text.slice(0,300)}}if(!r.ok)throw new Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail));return data}
function auth(){state=null;$('nav').innerHTML='';$('scope').innerHTML='';$('userbar').innerHTML='';$('content').innerHTML=`<section class="card auth"><div class="eyebrow">GET STARTED</div><h2 style="margin-top:14px">내 관리 콘솔에 로그인</h2><p class="muted">계정별로 VC·참여 세션·서비스 계약을 관리합니다.</p><form id="authform"><label for="username">아이디</label><input id="username" autocomplete="username" required minlength="3" maxlength="32"><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128"><div class="row" style="margin-top:22px"><button class="primary" type="submit">로그인</button><button type="button" data-action="signup">회원가입</button></div></form></section>`;$('authform').onsubmit=e=>{e.preventDefault();run(()=>login(false))}}
async function login(signup){const data={username:$('username').value,password:$('password').value};if(signup)await api('/accounts/register',data);const res=await api('/accounts/login',data);token=res.access_token;sessionStorage.setItem('portal-account-token',token);await refresh();notice(signup?'가입 완료. VC를 등록해보세요.':'로그인했습니다.')}
async function refresh(){state=await api('/console/state'+(target?'?account_id='+encodeURIComponent(target):''));render()}
function checks(rows){if(!rows?.length)return '<p class="muted">단계별 검사 정보가 없습니다.</p>';return `<div class="scroll"><table><thead><tr><th>대상</th><th>검사</th><th>결과</th><th>상세 설명</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.scope)}</td><td>${esc(r.name)}</td><td>${badge(r.status)}</td><td>${esc(r.detail)}</td></tr>`).join('')}</tbody></table></div>`}
function render(){if(!state)return;const entries=Object.entries(labels).filter(([k])=>k!=='admin'||state.is_admin);$('nav').innerHTML=entries.map(([k,v])=>`<button data-tab="${k}" class="${tab===k?'active':''}">${v}</button>`).join('');$('title').textContent=tab==='admin'?'Admin Console':'Management Console';$('userbar').innerHTML=badge('',state.is_admin?'관리자':'소비자')+btn('새로고침','refresh')+btn('로그아웃','logout');$('scope').innerHTML=target?`<div class="scope row between"><span>관리 대상: <b>${esc(state.user.username)}</b> · 관리자로 작업 중</span>${btn('내 계정으로 돌아가기','own')}</div>`:`<div class="muted">${esc(state.user.username)}님의 공간</div>`;
if(tab==='overview')overview();if(tab==='credentials')credentials();if(tab==='services')services();if(tab==='logs')logs().catch(e=>notice(e.message,true));if(tab==='admin')admin().catch(e=>notice(e.message,true))}
function overview(){const active=state.sessions.find(s=>s.expires>state.now),contracts=state.contracts.filter(c=>c.expires>state.now);$('content').innerHTML=`<div class="steps"><span>1. VC 등록·검증</span><span>2. 세션 연결</span><span>3. 서비스 계약</span><span>4. 데이터 요청</span></div><div class="grid"><section class="card"><h3>등록된 VC 세트</h3><h1>${state.credentials.length}</h1><p class="muted">각 세트의 상세 검증 결과를 확인하세요.</p>${btn('VC 관리','goto-credentials')}</section><section class="card"><h3>참여 세션</h3>${badge(active?'pass':'unknown',active?'연결됨':'미연결 / 만료')}<p>만료: ${dt(active?.expires)}</p><small>최대 24시간 · VC 유효기간 이내</small></section><section class="card"><h3>활성 서비스 계약</h3><h1>${contracts.length}</h1><p class="muted">연결 후 서비스를 선택해 계약하세요.</p>${btn('서비스 연결','goto-services')}</section></div><section class="card"><h2>실험 제어</h2><p>세션과 계약을 초기화해 다시 한 사이클을 실행할 수 있습니다. VC, 고정 주소, 과거 로그는 유지됩니다.</p>${btn('세션 종료 · 초기화','reset','','danger')} ${btn('활동 로그 확인','goto-logs')}</section><section class="card"><h2>고정 접속 주소</h2><p class="muted">최초 연결 시 생성됩니다. 세션을 재연결해도 주소는 유지됩니다. 서비스별 주소는 서비스 메뉴에서 복사하세요.</p>${state.access_path?'<p>접속 키가 발급되어 있습니다.</p>':'<p>아직 발급되지 않았습니다.</p>'}${btn('접속 키 재발급','rotate-key','','danger')}<p class="muted">재발급하면 이전 주소가 즉시 무효화됩니다. 키가 포함된 주소는 비밀번호처럼 취급하세요.</p></section>`}
function credentials(){$('content').innerHTML=`<section class="card"><h2>VC / VP 등록 및 검증</h2><p class="muted">JWT·JSON 또는 ZIP 파일을 업로드하면 기존 검증기로 검사합니다. 연결 전에는 다시 검증합니다.</p>${'<div class="row"><input id="files" type="file" multiple accept=".jwt,.json,.zip,.txt" aria-label="VC 파일">'+btn('업로드 · 검증','upload','','primary')+'</div>'}</section>${state.credentials.map(c=>`<section class="card"><div class="row between"><div><h3>${esc(c.summary.legal_name||c.summary.name||c.summary.subject_id||'VC 세트')}</h3><small>${dt(c.created)} · ${esc(c.summary.country)} · 만료 ${dt(c.valid_until)}</small></div>${badge(c.eligible?'pass':'fail',c.eligible?'최근 검사 통과':'확인 필요')}</div><p class="muted">${esc(c.id)}</p><div class="row">${btn('재검증','recheck',c.id)}${btn('세션 연결','connect',c.id,'primary')}${btn('VC 삭제','delete-vc',c.id,'danger')}</div><details><summary>문서별 상세 검증 결과</summary>${checks(c.checks)}</details></section>`).join('')||'<div class="card empty">등록된 VC가 없습니다. 먼저 파일을 업로드하세요.</div>'}`}
function services(){$('content').innerHTML=`<section class="card"><h2>서비스 카탈로그</h2><p class="muted">세션 연결 후 계약하면 같은 주소로 ping과 데이터 요청을 보낼 수 있습니다. 세션을 초기화하거나 재연결한 뒤에는 다시 계약하세요.</p></section>${state.services.map(s=>{const c=state.contracts.find(c=>c.service_id===s.id&&c.expires>state.now),url=state.access_path?location.origin+state.access_path+'/'+s.id:'';return `<section class="card"><div class="row between"><h2>${esc(s.name)}</h2>${badge(c?'pass':'unknown',c?'계약 활성':'미계약 / 만료')}</div><p>허용 국가 <b>${esc(s.country)}</b> · ${s.data_url==='demo://weather'?'고정 샘플':'외부 API'} · 만료 ${dt(c?.expires)}</p><div class="row">${btn('서비스 계약','contract',s.id,'primary')}${btn('계약 해지','revoke-contract',s.id)}${btn('ping 테스트','ping',s.id)}${btn('데이터 테스트','data',s.id)}</div>${url?`<label>Web-ECDIS base URL · 클릭 후 복사</label><input class="key" readonly type="password" value="${esc(url)}" id="url-${esc(s.id)}" aria-label="고정 접속 주소"><div class="row" style="margin-top:8px">${btn('주소 표시 / 숨김','show-url',s.id)}${btn('주소 복사','copy',s.id)}</div><label>데이터 테스트 쿼리 (실제 API 설정 시)</label><input id="query-${esc(s.id)}" class="key" placeholder="source=...&nw_lon=...">`:'<p class="muted">세션을 먼저 연결하면 주소가 생성됩니다.</p>'}</section>`}).join('')||'<div class="card empty">등록된 서비스가 없습니다. 관리자가 샘플 서비스를 등록해주세요.</div>'}<section class="card"><h2>최근 테스트 응답</h2><pre id="response">ping 또는 데이터 테스트를 실행하세요.</pre></section>`}
async function logs(){const q=new URLSearchParams({offset:String(logOffset),result:logFilter});if(target)q.set('account_id',target);if(allLogs&&state.is_admin)q.set('all_accounts','true');const res=await api('/console/logs?'+q);if(tab!=='logs')return;$('content').innerHTML=`<section class="card"><div class="row between"><div><h2>활동 및 검증 로그</h2><small>총 ${res.total}건 · 최근 작업부터 표시 · 초기화 후에도 보존</small></div><div class="row"><select id="logfilter" aria-label="결과 필터"><option value="">모든 결과</option><option value="pass">성공 / 통과</option><option value="fail">실패</option></select>${state.is_admin?'<label><input id="alllogs" type="checkbox" '+(allLogs?'checked':'')+'> 전체 계정</label>':''}</div></div>${res.logs.map(l=>`<details><summary><span class="row">${badge(l.result)}<small>${dt(l.created)}</small><b>${esc(l.summary)}</b><span class="muted">${esc(l.username||'미인증')} · ${l.duration_ms}ms</span></span></summary><p><b>작업</b> ${esc(l.action)} · HTTP ${l.details.http_status} · <b>실행자</b> ${esc(l.actor_username||'접속 키 / 미인증')}</p><small>작업 ID ${esc(l.id)}</small>${checks(l.details.checks)}${l.details.stages?'<p>'+l.details.stages.map(s=>esc(s.name)+' '+badge(s.status)).join(' → ')+'</p>':''}</details>`).join('')||'<p class="empty">기록된 작업이 없습니다.</p>'}<div class="row" style="margin-top:15px">${logOffset?btn('이전','prev'):''}${logOffset+50<res.total?btn('다음','next'):''}</div></section>`;$('logfilter').value=logFilter;$('logfilter').onchange=e=>{logFilter=e.target.value;logOffset=0;run(logs)};if($('alllogs'))$('alllogs').onchange=e=>{allLogs=e.target.checked;logOffset=0;run(logs)}}
async function admin(){const res=await api('/admin/accounts');if(tab!=='admin')return;$('content').innerHTML=`<section class="card"><h2>계정 관리</h2><p class="muted">대상 계정의 콘솔을 열어 VC 재검증·삭제, 세션 연결·초기화, 계약 및 접속 키를 관리합니다.</p><table><thead><tr><th>계정</th><th>가입 시각</th><th>관리</th></tr></thead><tbody>${res.accounts.map(a=>`<tr><td>${esc(a.username)}</td><td>${dt(a.created)}</td><td>${btn('콘솔 열기','manage',a.id)}</td></tr>`).join('')}</tbody></table></section><section class="card"><h2>서비스 · 국가 정책 등록</h2><label>서비스 이름</label><input id="svcname" value="Weather Demo"><label>API base URL</label><input id="svcurl" class="key" value="demo://weather"><label>허용 국가 (두 자리)</label><input id="svccountry" value="KR" maxlength="2"><p class="muted">샘플은 demo://weather, 실제 API는 /griddata 등이 붙기 전 base URL을 입력하세요. 외부 origin은 서버 설정에서 허용해야 합니다.</p>${btn('서비스 등록','add-service','','primary')}</section><section class="card"><h2>등록된 서비스</h2>${state.services.map(s=>`<div class="row between" style="margin:14px 0"><span>${esc(s.name)} · ${esc(s.country)}<br><small>${esc(s.data_url)}</small></span>${btn('서비스 삭제','delete-service',s.id,'danger')}</div>`).join('')||'<p class="muted">서비스 없음</p>'}<p class="muted">PoC 정책 변경은 서비스 삭제 후 재등록으로 진행합니다. 삭제 시 관련 계약도 해제됩니다.</p></section>`}
async function act(action,id){if(action.startsWith('goto-')){tab=action.slice(5);render();return}if(action==='refresh')return refresh();if(action==='signup')return login(true);if(action==='logout'){await api('/accounts/logout',{});token='';sessionStorage.removeItem('portal-account-token');target='';auth();return}if(action==='own'||action==='manage'){target=action==='own'?'':id;tab='overview';return refresh()}if(action==='upload'){const files=$('files').files;if(!files.length)throw Error('파일을 선택해주세요');const form=new FormData();for(const f of files)form.append('files',f);const res=await api('/credentials/import'+(target?'?account_id='+encodeURIComponent(target):''),form);await refresh();notice(res.report.eligible_for_demo?'VC 검증 통과. 세션을 연결해보세요.':'검증이 완료되었습니다. 실패·확인 불가 항목을 확인하세요.',!res.report.eligible_for_demo);return}if(action==='prev'||action==='next'){logOffset=Math.max(0,logOffset+(action==='next'?50:-50));return logs()}if(action==='show-url'){$('url-'+id).type=$('url-'+id).type==='password'?'text':'password';return}if(action==='copy'){const el=$('url-'+id);try{await navigator.clipboard.writeText(el.value);notice('접속 주소를 복사했습니다.')}catch{el.type='text';el.select();notice('주소를 선택했습니다. Ctrl+C로 복사하세요.')}return}if(action==='ping'||action==='data'){if(!state.access_path)throw Error('먼저 세션을 연결해주세요');const query=$('query-'+id)?.value||'';try{const res=await api(state.access_path+'/'+id+'/'+(action==='ping'?'ping':'griddata')+(action==='data'&&query?'?'+query:''));$('response').textContent=JSON.stringify(res,null,2);notice('요청 성공. 활동 로그에서 결과를 확인할 수 있습니다.')}catch(e){$('response').textContent=e.message;throw e}return}if(action==='add-service'){await api('/service-offerings',{name:$('svcname').value,data_url:$('svcurl').value,country:$('svccountry').value.toUpperCase()});await refresh();notice('서비스를 등록했습니다.');return}const prompts={'reset':'세션과 계약을 초기화할까요? VC, 주소, 로그는 유지됩니다.','delete-vc':'VC를 삭제할까요? 연결된 세션과 계약도 해제됩니다.','rotate-key':'접속 키를 재발급할까요? 기존 Web-ECDIS 주소는 사용할 수 없게 됩니다.','delete-service':'서비스와 관련 계약을 삭제할까요?','connect':'세션을 연결할까요? 기존 세션과 계약은 초기화되며 서비스 계약을 다시 해야 합니다.'};if(prompts[action]&&!confirm(prompts[action]))return;if(action==='delete-service')await api('/admin/services/'+id+'/delete',{});else await api('/console/'+action,{account_id:target||null,import_id:['recheck','connect','delete-vc'].includes(action)?id:null,service_id:['contract','revoke-contract'].includes(action)?id:null});await refresh();notice('작업 완료. 상세 결과는 활동 및 검증 로그에서 확인하세요.')}
let busy=false;async function run(fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn()}catch(e){notice(e.message,true)}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;logOffset=0;render()}else if(b.dataset.action)run(()=>act(b.dataset.action,b.dataset.id))});
if(token)refresh().catch(()=>{token='';sessionStorage.removeItem('portal-account-token');auth()});else auth();
</script></body></html>
