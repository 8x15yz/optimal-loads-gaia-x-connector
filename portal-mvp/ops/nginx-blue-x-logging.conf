# Blue-X 포털 앞단 Nginx — 접속 키 마스킹 로그
#
# /access/{key}/{service_id}/... 형태의 주소에서 {key}를 *** 로 바꿔 기록함.
# 포털 앱(uvicorn)은 access log를 끄고 실행하지만, 앞단 Nginx 기본 로그에는 키 원문이 남으므로 이 설정이 필요함.
#
# 적용 방법
#   1) 아래 [http 컨텍스트] 부분을 /etc/nginx/conf.d/blue-x-logging.conf 로 저장
#   2) 포털 server 블록(443)의 기존 access_log 줄을 [server 컨텍스트] 줄로 교체 (없으면 추가)
#   3) sudo nginx -t && sudo systemctl reload nginx
#   4) 기존 로그 파일(/var/log/nginx/access.log*)에는 이미 키 원문이 남아 있으므로,
#      필요하면 키를 재발급(콘솔의 키 재발급)하고 이전 로그 파일을 정리함
#
# 참고: Nginx error_log는 형식을 바꿀 수 없어, upstream 오류 시 요청 줄(키 포함)이 남을 수 있음.
#       error_log 파일 접근 권한을 제한해 둘 것.

# ---------------- [http 컨텍스트] ----------------
map $request_uri $bluex_masked_uri {
    "~^(?<bx_pre>/access/)[^/?]+(?<bx_rest>.*)$"  "${bx_pre}***${bx_rest}";
    default                                        $request_uri;
}
map $http_referer $bluex_masked_referer {
    ""                                                 "-";
    "~^(?<bxr_pre>.*/access/)[^/?]+(?<bxr_rest>.*)$"  "${bxr_pre}***${bxr_rest}";
    default                                            $http_referer;
}
# combined 형식과 같은 순서 + 끝에 처리 시간과 활동 로그 ID 추가
#   $request_time            : 전체 처리 시간(초)
#   $upstream_response_time  : 포털 앱 응답 시간(초)
#   $sent_http_x_activity_id : 포털 활동 로그 ID (= Weather API로 보낸 X-Request-ID)
log_format bluex_masked '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $bluex_masked_uri $server_protocol" '
                        '$status $body_bytes_sent "$bluex_masked_referer" "$http_user_agent" '
                        '$request_time $upstream_response_time "$sent_http_x_activity_id"';

# ---------------- [server 컨텍스트] ----------------
# access_log /var/log/nginx/access.log bluex_masked;
